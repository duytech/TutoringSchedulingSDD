name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    # The integration tests read the connection string in appsettings.Development.json
    # (localhost, postgres/postgres) and create their own database on this server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Test projects one by one: building the whole solution would also build web/ and need Node.
      - name: Unit tests
        run: dotnet test tests/BrightPath.Api.UnitTests
      - name: Integration tests
        run: dotnet test tests/BrightPath.Api.IntegrationTests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The images CD publishes, built and checked through the web container before they reach main.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - run: bash scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
