# In the container nginx does what the Vite proxy does in dev: the page and the API share one origin.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # "api" is the API's service name in compose.yaml.
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Page routes such as /rooms and /tutors/T1 are handled by the React router.
    location / {
        try_files $uri /index.html;
    }
}
